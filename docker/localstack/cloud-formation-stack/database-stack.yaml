AWSTemplateFormatVersion: '2010-09-09'

Resources:
  ChannelPostDatabase:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "ChannelPost"
      AttributeDefinitions:
        - AttributeName: "id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "id"
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST 